[package]
name = "expr-id-exhaustion-fork"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zenoh = { version = "=1.8.0", default-features = false, features = ["transport_tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Standalone project: each sample pins its own zenoh version.
[workspace]

# zenoh 1.8.0 plus O(1) wrapping-cursor ExprId allocation and an "exhausted" flag
# that falls back to sending full key expressions (commit 25c6174e).
[patch.crates-io]
zenoh = { git = "https://github.com/gkuga/zenoh", rev = "25c6174e6477c355c4db6fd09e2044523fb73b37" }
